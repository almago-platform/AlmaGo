<text x="535" y="855" font-size="65" fill="#182C3A" font-weight="700" >commence</text>
<text x="535" y="926" font-size="65" fill="#182C3A" font-weight="700" >ici.</text>
<text x="540" y="988" font-size="29" fill="#182C3A" font-weight="400" >Étudier en Allemagne,</text>
<text x="540" y="1027" font-size="29" fill="#182C3A" font-weight="400" >étape par étape.</text>
<rect x="540" y="1067" width="504" height="106" rx="14" fill="#176B5B" stroke="none"/>
<text x="1015" y="1127" font-size="29" fill="#FFFFFF" font-weight="400" class="ar" text-anchor="start" lang="ar">من تونس لألمانيا، خطوة بخطوة</text>
<path d="M550 1220H928" fill="none" stroke="#176B5B" stroke-width="3"/>
<circle cx="550" cy="1220" r="7" fill="#176B5B"/><circle cx="739" cy="1220" r="7" fill="#176B5B"/><circle cx="928" cy="1220" r="7" fill="#176B5B"/>
<text x="1042" y="1229" font-size="20" fill="#182C3A" font-weight="400" text-anchor="end">1 / 7</text>

<rect x="1208" y="552" width="411" height="730" rx="0" fill="#182C3A" stroke="none"/>
<text x="1242" y="619" font-size="35" font-weight="700" letter-spacing="-2"><tspan fill="#FFFFFF">Alma</tspan><tspan fill="#F4A77D">Go</tspan></text>
<text x="1242" y="689" font-size="23" fill="#F4A77D" font-weight="700" >Vrai ou faux ?</text>
<text x="1242" y="764" font-size="42" fill="#FFFFFF" font-weight="700" >Une admission</text>
<text x="1242" y="821" font-size="42" fill="#FFFFFF" font-weight="700" >= un visa ?</text>
<rect x="1242" y="866" width="343" height="262" rx="16" fill="#F5F2EA" stroke="none"/>
<text x="1265" y="935" font-size="55" fill="#176B5B" font-weight="700" >Non.</text>
<text x="1265" y="978" font-size="22" fill="#182C3A" font-weight="700" >Deux décisions distinctes.</text>
<text x="1265" y="1025" font-size="20" fill="#182C3A" font-weight="400" >Admission → université</text>
<text x="1265" y="1065" font-size="20" fill="#182C3A" font-weight="400" >Visa → autorités</text>
<text x="1323" y="1094" font-size="20" fill="#182C3A" font-weight="400" >compétentes</text>
<text x="1242" y="1198" font-size="23" fill="#FFFFFF" font-weight="700" >Comprendre les étapes.</text>
<text x="1242" y="1237" font-size="19" fill="#FFFFFF" font-weight="400" >Aucune décision garantie.</text>

<path d="M72 1323H1726" fill="none" stroke="#CAD2CE" stroke-width="1"/>
<text x="72" y="1366" font-size="21" fill="#182C3A" font-weight="400" >Mot-symbole conceptuel et gabarits de démonstration · pas un logo officiel ni des publications finales.</text>
