<rect x="0" y="0" width="1800" height="1400" rx="0" fill="#F5F2EA" stroke="none"/>
<text x="72" y="76" font-size="25" fill="#182C3A" font-weight="700" >AlmaGo / identité visuelle</text>
<rect x="1396" y="41" width="330" height="52" rx="26" fill="#FFFFFF" stroke="none"/>
<text x="1561" y="75" font-size="19" fill="#182C3A" font-weight="700" text-anchor="middle" letter-spacing="1.5">PROPOSITION · 01</text>

<text x="65" y="247" font-size="151" font-weight="700" letter-spacing="-2"><tspan fill="#182C3A">Alma</tspan><tspan fill="#176B5B">Go</tspan></text>
<text x="72" y="309" font-size="30" fill="#182C3A" font-weight="400" >Étudier en Allemagne, étape par étape.</text>
<text x="753" y="370" font-size="34" fill="#176B5B" font-weight="400" class="ar" text-anchor="start" lang="ar">من تونس لألمانيا، خطوة بخطوة</text>
