<text x="72" y="934" font-size="35" fill="#176B5B" font-weight="400" >Aa / 0123</text>
<text x="72" y="1007" font-size="25" fill="#182C3A" font-weight="700" >Deux langues.</text>
<text x="72" y="1043" font-size="25" fill="#182C3A" font-weight="400" >Des blocs distincts.</text>
<text x="72" y="1105" font-size="25" fill="#182C3A" font-weight="700" >Une idée par visuel.</text>
<text x="72" y="1141" font-size="25" fill="#182C3A" font-weight="400" >Sans visage.</text>
<text x="72" y="1177" font-size="25" fill="#182C3A" font-weight="400" >Sans fausse preuve.</text>
