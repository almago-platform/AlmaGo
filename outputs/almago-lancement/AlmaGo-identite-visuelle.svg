<text x="500" y="515" font-size="22" fill="#182C3A" font-weight="700" >Carrousel · 4:5</text>
<text x="1208" y="515" font-size="22" fill="#182C3A" font-weight="700" >Reel / TikTok · 9:16</text>

<text x="72" y="606" font-size="35" fill="#182C3A" font-weight="700" >Un chemin,</text>
<text x="72" y="651" font-size="35" fill="#182C3A" font-weight="700" >des repères.</text>
<text x="72" y="704" font-size="24" fill="#182C3A" font-weight="400" >Des étapes visibles,</text>
<text x="72" y="738" font-size="24" fill="#182C3A" font-weight="400" >sans codes officiels.</text>
