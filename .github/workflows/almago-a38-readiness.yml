name: AlmaGo A38 Review Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/A38_OWNER_CONFIRMATION.md"
      - "docs/legal-imprint-draft.md"
      - "docs/legal-privacy-draft.md"
      - "docs/legal-terms-draft.md"
      - ".github/workflows/almago-a38-readiness.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: almago-a38-review-readiness
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check explicit review-ready flag
        id: flag
        shell: bash
        run: |
          if grep -Fxq "A38_REVIEW_READY: true" docs/A38_OWNER_CONFIRMATION.md; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "A38 review-ready flag is enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A38_REVIEW_READY is not true yet; no readiness evidence will be published."
          fi

      - name: Reject unresolved legal placeholders
        if: steps.flag.outputs.ready == 'true'
        shell: bash
        run: |
          files=(
            docs/A38_OWNER_CONFIRMATION.md
            docs/legal-imprint-draft.md
            docs/legal-privacy-draft.md
            docs/legal-terms-draft.md
          )

          blocker='NE PAS PUBLIER TEL QUEL|non validé juridiquement|\[À CONFIRMER[^]]*\]|\[À DÉTERMINER[^]]*\]|\[NOM[^]]*\]|\[EMAIL[^]]*\]|\[DURÉE[^]]*\]|\[RÉDACTION[^]]*\]|\[DATE[^]]*\]|\[PERSONNE[^]]*\]|\[N/A si[^]]*\]|\[personne physique[^]]*\]|\[gratuit / payant[^]]*\]|\[nom/contact[^]]*\]|\[non / oui[^]]*\]'

          if grep -En "$blocker" "${files[@]}"; then
            echo "::error::A38_REVIEW_READY=true but unresolved placeholders or draft warnings remain."
            exit 1
          fi

          echo "No unresolved A38 draft markers detected."

      - name: Publish exact-SHA readiness evidence
        if: steps.flag.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const marker = `<!-- almago-a38-review-ready:sha=${sha} -->`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "almago-plan",
              per_page: 100,
            });

            const issue = issues.find(item =>
              !item.pull_request &&
              String(item.body || "").includes("<!-- almago-plan-task:A38 -->")
            );

            if (!issue) {
              core.info("A38 is already closed or not materialized.");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });

            if (comments.some(item => String(item.body || "").includes(marker))) {
              core.info("Exact-SHA A38 readiness evidence already exists.");
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                "A38 REVIEW READY FOR HUMAN APPROVAL",
                "",
                "Exact main SHA: " + sha,
                marker,
                "",
                "Automated checks found no unresolved A38 placeholders or draft warnings in the four canonical legal-review files.",
                "This is a readiness check only; A38 still requires explicit human approval signaled by an authorized repository admin."
              ].join("\n"),
            });

            core.info("Published A38 readiness evidence for exact SHA " + sha + ".");
