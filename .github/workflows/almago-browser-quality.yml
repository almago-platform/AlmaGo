name: AlmaGo Browser Quality

# V3.2: bounded visual regression gate on UI PRs; full suite remains manually dispatchable.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/**"
      - "src/components/**"
      - "src/content/**"
      - "public/**"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - ".github/workflows/almago-browser-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almago-browser-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      ALMAGO_PHASE2_ENABLED: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install browser-quality tools without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2 @lhci/cli@0.15.1

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare safe public test configuration
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_browser_quality_placeholder" >> "$GITHUB_ENV"
          fi

      - name: Build AlmaGo
        run: npm run build

      - name: Start production server
        run: |
          mkdir -p artifacts
          npm start -- -p 3000 > artifacts/server.log 2>&1 &
          echo $! > /tmp/almago-server.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat artifacts/server.log
          exit 1

      - name: V3.2 bounded PR visual regression gate
        if: github.event_name == 'pull_request'
        run: |
          npx playwright test tests/e2e/visual-v3-2-gate.spec.mjs \
            --config=playwright.config.mjs \
            --project=mobile-compact-chromium \
            --project=mobile-chromium \
            --project=desktop-1280-chromium \
            --project=desktop-chromium

      - name: Full manual responsive and accessibility suite
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test --config=playwright.config.mjs

      - name: Gemini visual review of screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && vars.ALMAGO_AI_ENABLED == 'true' && vars.ALMAGO_AI_BILLING_CAP_CONFIRMED == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALMAGO_GEMINI_MODEL: ${{ vars.ALMAGO_GEMINI_MODEL }}
          ALMAGO_VISUAL_REVIEW_MAX_IMAGES: "2"
        run: node autonomy/visual-review.mjs artifacts/screenshots

      - name: Lighthouse advisory budgets
        if: github.event_name == 'workflow_dispatch'
        run: npx lhci autorun --config=./lighthouserc.cjs || true

      - name: Store browser-quality artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: almago-browser-quality-${{ github.run_id }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: warn
          retention-days: 7
