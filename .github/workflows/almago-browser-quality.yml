name: AlmaGo Browser Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "playwright.config.mjs"
      - "lighthouserc.cjs"
      - "tests/e2e/**"
      - ".github/workflows/almago-browser-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "playwright.config.mjs"
      - "lighthouserc.cjs"
      - "tests/e2e/**"
      - ".github/workflows/almago-browser-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almago-browser-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install browser-quality tools without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2 @lhci/cli@0.14.0

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare safe public test configuration
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_browser_quality_placeholder" >> "$GITHUB_ENV"
          fi

      - name: Build AlmaGo
        run: npm run build

      - name: Start production server
        run: |
          mkdir -p artifacts
          npm start -- -p 3000 > artifacts/server.log 2>&1 &
          echo $! > /tmp/almago-server.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat artifacts/server.log
          exit 1

      - name: Playwright responsive and accessibility smoke tests
        run: npx playwright test --config=playwright.config.mjs

      - name: Gemini visual review of screenshots
        if: ${{ vars.ALMAGO_AI_ENABLED == 'true' && vars.ALMAGO_AI_BILLING_CAP_CONFIRMED == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALMAGO_GEMINI_MODEL: ${{ vars.ALMAGO_GEMINI_MODEL }}
          ALMAGO_VISUAL_REVIEW_MAX_IMAGES: "2"
        run: node autonomy/visual-review.mjs artifacts/screenshots

      - name: Lighthouse advisory budgets
        if: always()
        run: npx lhci autorun --config=./lighthouserc.cjs || true

      - name: Store browser-quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almago-browser-quality-${{ github.run_id }}
          path: |
            artifacts/
          if-no-files-found: warn
          retention-days: 7
