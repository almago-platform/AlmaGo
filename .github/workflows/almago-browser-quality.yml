name: AlmaGo Browser Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/**"
      - "src/components/**"
      - "src/content/**"
      - "public/**"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - ".github/workflows/almago-browser-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almago-browser-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      ALMAGO_PHASE2_ENABLED: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browser test tools without changing the lockfile
        run: npm install --no-save --package-lock=false @supabase/supabase-js@2.116.0 @playwright/test@1.55.0 @axe-core/playwright@4.10.2 @lhci/cli@0.15.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare safe public test configuration
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_browser_quality_placeholder" >> "$GITHUB_ENV"
          fi

      - name: Build and start production server
        shell: bash
        run: |
          mkdir -p artifacts
          npm run build
          npm start -- -p 3000 > artifacts/server.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat artifacts/server.log
          exit 1

      - name: Runtime CSP nonce smoke
        run: node tests/security/csp-runtime-smoke.mjs http://127.0.0.1:3000

      - name: Responsive and accessibility regression
        run: |
          npx playwright test tests/e2e/ui-regression.spec.mjs \
            --config=playwright.config.mjs \
            --project=mobile-compact-chromium \
            --project=mobile-chromium \
            --project=desktop-1280-chromium \
            --project=desktop-chromium

      - name: Full browser suite
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test --config=playwright.config.mjs

      - name: Lighthouse advisory budgets
        if: github.event_name == 'workflow_dispatch'
        run: npx lhci autorun --config=./lighthouserc.cjs || true

      - name: Store browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: almago-browser-quality-${{ github.run_id }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: warn
          retention-days: 7
