name: AlmaGo Automation Failure Watch

on:
  workflow_run:
    workflows: ["AlmaGo PR CI", "AlmaGo Browser Quality"]
    types: [completed]

permissions:
  pull-requests: read
  issues: write

concurrency:
  group: almago-failure-watch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  mark-blocked:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;

            let pullNumber = Number(run.pull_requests?.[0]?.number || 0);
            if (!pullNumber && run.head_branch) {
              const { data: candidates } = await github.rest.pulls.list({
                owner, repo, state: "open", head: `${owner}:${run.head_branch}`, per_page: 10
              });
              pullNumber = Number(candidates.find(pr => pr.head.sha === run.head_sha)?.number || 0);
            }

            core.summary
              .addHeading("AlmaGo automation failure")
              .addRaw(`Issue #${issueNumber} marked blocked after ${run.name} failure.`)
              .write();
            if (!pullNumber) return;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pr.state !== "open" || pr.head.sha !== run.head_sha) return;
            const match = pr.head.ref.match(/^automation\/issue-([1-9][0-9]*)$/);
            if (!match || pr.head.repo?.full_name !== `${owner}/${repo}`) return;
            const issueNumber = Number(match[1]);

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const labels = new Set(issue.labels.map(label => typeof label === "string" ? label : label.name));
            if (!labels.has("almago-plan")) return;

            for (const label of ["almago-ai-running", "almago-ai-proposed"]) {
              if (labels.has(label)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label }).catch(() => null);
              }
            }
            if (!labels.has("almago-ai-blocked")) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issueNumber, labels: ["almago-ai-blocked"]
              });
            }

            const marker = `<!-- almago-automation-failure:${run.id} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100
            });
            if (!comments.some(comment => String(comment.body || "").includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: [
                  marker,
                  "AUTOMATION: BLOCKED",
                  "",
                  `Workflow **${run.name}** failed for PR #${pullNumber}.`,
                  `HEAD: ${run.head_sha}`,
                  `Run: ${run.html_url}`,
                  "",
                  "No extra provider call was spent automatically. Inspect the failure before relabeling this task `almago-ai-ready`."
                ].join("\n")
              });
            }
