name: AlmaGo Final Release Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE to run the final publication gate"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  statuses: read
  actions: write

concurrency:
  group: almago-final-release-gate
  cancel-in-progress: false

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main_sha: ${{ steps.prereqs.outputs.main_sha }}
    steps:
      - name: Verify release prerequisites
        id: prereqs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.payload.inputs?.confirmation !== "RELEASE") {
              core.setFailed('Confirmation must be exactly "RELEASE".');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const mainBranch = repository.default_branch || "main";
            const { data: mainRef } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: mainBranch,
            });
            const mainSha = mainRef.commit.sha;

            if (mainRef.protected !== true) {
              core.summary
                .addHeading("AlmaGo final release gate")
                .addRaw(
                  "BLOCKED — the default branch " +
                  mainBranch +
                  " is not protected. Resolve repository-hardening issue #336 before release readiness."
                )
                .write();
              core.setFailed(
                "A45 requires protected main before RELEASE GATE: READY can be published."
              );
              return;
            }

            const { data: hardeningIssue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: 336,
            });
            const hardeningComplete =
              hardeningIssue.state === "closed" &&
              hardeningIssue.state_reason !== "not_planned";
            if (!hardeningComplete) {
              core.summary
                .addHeading("AlmaGo final release gate")
                .addRaw(
                  "BLOCKED — repository-hardening issue #336 is not completed. Protection must be reviewed and confirmed before release readiness."
                )
                .write();
              core.setFailed(
                "A45 requires completed repository-hardening issue #336 before RELEASE GATE: READY."
              );
              return;
            }

            core.setOutput("main_sha", mainSha);

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              labels: "almago-plan",
              per_page: 100,
            });

            const taskId = issue =>
              String(issue.body || "").match(/<!--\s*almago-plan-task:(A\d{2})\s*-->/)?.[1];

            const planIssue = id =>
              allIssues.find(item => !item.pull_request && taskId(item) === id);

            const completed = id => {
              const issue = planIssue(id);
              if (!issue) return false;
              const labels = new Set(
                (issue.labels || []).map(label => typeof label === "string" ? label : label.name),
              );
              return issue.state === "closed" || labels.has("almago-plan-done");
            };

            const required = ["A38", "A43", "A44"];
            const missing = required.filter(id => !completed(id));
            if (missing.length) {
              core.summary
                .addHeading("AlmaGo final release gate")
                .addRaw("BLOCKED — incomplete prerequisites: " + missing.join(", "))
                .write();
              core.setFailed("Release prerequisites are incomplete: " + missing.join(", "));
              return;
            }

            const evidenceMatches = {
              A38: body =>
                body.includes(`<!-- almago-a38-human-approved:sha=${mainSha};`),
              A43: body =>
                body.includes("<!-- almago-a43-evidence:") &&
                body.includes(`;sha=${mainSha} -->`),
              A44: body =>
                body.includes("<!-- almago-a44-evidence:") &&
                body.includes(`;sha=${mainSha} -->`),
            };

            const staleEvidence = [];
            for (const id of required) {
              const issue = planIssue(id);
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              });
              const hasExactEvidence = comments.some(comment =>
                evidenceMatches[id](String(comment.body || "")),
              );
              if (!hasExactEvidence) staleEvidence.push(id);
            }

            if (staleEvidence.length) {
              core.summary
                .addHeading("AlmaGo final release gate")
                .addRaw(
                  "BLOCKED — prerequisite evidence is missing or stale for exact main SHA " +
                    mainSha +
                    ": " +
                    staleEvidence.join(", "),
                )
                .write();
              core.setFailed(
                "A45 requires exact-main prerequisite evidence for: " +
                  staleEvidence.join(", "),
              );
              return;
            }

            let observabilityEnabled = "";
            let observabilityProvider = "";
            try {
              const enabled = await github.rest.actions.getRepoVariable({
                owner,
                repo,
                name: "ALMAGO_OBSERVABILITY_ENABLED",
              });
              observabilityEnabled = String(enabled.data.value || "");
              const provider = await github.rest.actions.getRepoVariable({
                owner,
                repo,
                name: "ALMAGO_OBSERVABILITY_PROVIDER",
              });
              observabilityProvider = String(provider.data.value || "").trim();
            } catch (error) {
              core.setFailed(
                "A44 evidence is missing: configure ALMAGO_OBSERVABILITY_ENABLED and ALMAGO_OBSERVABILITY_PROVIDER.",
              );
              return;
            }

            if (observabilityEnabled !== "true" || !observabilityProvider) {
              core.setFailed(
                "A44 evidence is incomplete: ALMAGO_OBSERVABILITY_ENABLED must be true and ALMAGO_OBSERVABILITY_PROVIDER must be non-empty.",
              );
              return;
            }

            core.summary
              .addHeading("AlmaGo final release gate")
              .addRaw(
                "Prerequisites A38, A43 and A44 are complete. Observability provider: " +
                observabilityProvider +
                ". Testing exact main SHA: " +
                mainSha,
              )
              .write();

  quality:
    needs: prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ALMAGO_E2E_STUDENT_EMAIL: ${{ vars.ALMAGO_E2E_STUDENT_EMAIL || 'phase3.student.a@almago.test' }}
      ALMAGO_E2E_STUDENT_PASSWORD: ${{ secrets.ALMAGO_E2E_STUDENT_PASSWORD }}
      ALMAGO_E2E_ADMIN_EMAIL: ${{ vars.ALMAGO_E2E_ADMIN_EMAIL || 'phase3.admin@almago.test' }}
      ALMAGO_E2E_ADMIN_PASSWORD: ${{ secrets.ALMAGO_E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prerequisites.outputs.main_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Require authenticated E2E configuration
        shell: bash
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ALMAGO_E2E_STUDENT_EMAIL ALMAGO_E2E_STUDENT_PASSWORD ALMAGO_E2E_ADMIN_EMAIL ALMAGO_E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is required for final release"; exit 1; fi
          done

      - name: Require distinct test-only identities
        shell: bash
        run: |
          student_email="$(printf '%s' "$ALMAGO_E2E_STUDENT_EMAIL" | tr '[:upper:]' '[:lower:]')"
          admin_email="$(printf '%s' "$ALMAGO_E2E_ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]')"

          if [ "$student_email" = "$admin_email" ]; then
            echo "::error::Student and admin E2E accounts must be different."
            exit 1
          fi

          for email in "$student_email" "$admin_email"; do
            case "$email" in
              *e2e*|*test*) ;;
              *)
                echo "::error::Final-release E2E emails must be dedicated test identities containing 'e2e' or 'test'."
                exit 1
                ;;
            esac
          done

      - name: Install application dependencies
        run: npm ci

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Regression checks
        run: |
          npm test
          npx tsc --noEmit
          npm run lint
          npm run build
          git diff --check

      - name: Install browser-quality tools without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2 @lhci/cli@0.14.0

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact production build
        shell: bash
        run: |
          mkdir -p artifacts/final-release
          npm start -- -p 3000 > artifacts/final-release/server.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat artifacts/final-release/server.log
          exit 1

      - name: Public responsive and accessibility journeys
        run: npx playwright test tests/e2e/public-quality.spec.mjs

      - name: Authenticated student/admin isolation journeys
        run: npx playwright test tests/e2e/authenticated.spec.mjs --project=desktop-chromium

      - name: Lighthouse advisory budgets
        run: npx lhci autorun --config=./lighthouserc.cjs || true

      - name: Upload final release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almago-final-release-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  render-and-ready:
    needs: [prerequisites, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_BASE_URL: https://almago-dev.onrender.com
      EXPECTED_MAIN_SHA: ${{ needs.prerequisites.outputs.main_sha }}
    steps:
      - name: Require exact-main Render revision
        shell: bash
        run: |
          expected_short="${EXPECTED_MAIN_SHA:0:12}"
          mkdir -p artifacts/final-release

          for i in {1..30}; do
            health="$(curl --fail --silent --show-error --max-time 5 "$RENDER_BASE_URL/api/health" 2>/dev/null || true)"
            if [ -n "$health" ]; then
              printf '%s\n' "$health" > artifacts/final-release/render-health.json
              revision="$(printf '%s' "$health" | jq -r '.revision // empty' 2>/dev/null || true)"
              branch="$(printf '%s' "$health" | jq -r '.branch // empty' 2>/dev/null || true)"

              if [ "$revision" = "$expected_short" ] && [ "$branch" = "main" ]; then
                echo "Render is serving exact main revision $revision."
                exit 0
              fi

              echo "Render is healthy but not yet on exact main (expected $expected_short, got ${revision:-none}, branch ${branch:-none})."
            fi
            sleep 5
          done

          echo "::error::Render did not serve exact main revision $expected_short within the verification window."
          exit 1

      - name: Smoke canonical Render public routes
        shell: bash
        run: |
          for path in / /login /signup; do
            echo "Checking $RENDER_BASE_URL$path"
            curl --fail --silent --show-error --max-time 15 "$RENDER_BASE_URL$path" > /dev/null
          done

      - name: Revalidate exact main and publish readiness
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = "${{ needs.prerequisites.outputs.main_sha }}";

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const mainBranch = repository.default_branch || "main";
            const { data: currentMain } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: mainBranch,
            });
            if (currentMain.commit.sha !== sha) {
              core.summary
                .addHeading("AlmaGo final release gate")
                .addRaw(
                  "BLOCKED — main changed during the release gate. Expected " +
                  sha +
                  ", current " +
                  currentMain.commit.sha +
                  ".",
                )
                .write();
              core.setFailed("main changed during the release gate; rerun on the new exact SHA.");
              return;
            }

            if (currentMain.protected !== true) {
              core.setFailed(
                "A45 cannot publish READY because main protection was removed during the release gate."
              );
              return;
            }

            const { data: finalHardeningIssue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: 336,
            });
            const finalHardeningComplete =
              finalHardeningIssue.state === "closed" &&
              finalHardeningIssue.state_reason !== "not_planned";
            if (!finalHardeningComplete) {
              core.setFailed(
                "A45 cannot publish READY because repository-hardening issue #336 is no longer completed."
              );
              return;
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              labels: "almago-plan",
              per_page: 100,
            });

            const finalTaskId = issue =>
              String(issue.body || "").match(/<!--\s*almago-plan-task:(A\d{2})\s*-->/)?.[1];
            const finalRequired = ["A38", "A43", "A44"];
            const finalEvidenceMatches = {
              A38: body =>
                body.includes(`<!-- almago-a38-human-approved:sha=${sha};`),
              A43: body =>
                body.includes("<!-- almago-a43-evidence:") &&
                body.includes(`;sha=${sha} -->`),
              A44: body =>
                body.includes("<!-- almago-a44-evidence:") &&
                body.includes(`;sha=${sha} -->`),
            };

            for (const id of finalRequired) {
              const prerequisite = allIssues.find(
                item => !item.pull_request && finalTaskId(item) === id,
              );
              if (!prerequisite) {
                core.setFailed("A45 prerequisite disappeared before readiness: " + id);
                return;
              }
              const labels = new Set(
                (prerequisite.labels || []).map(label =>
                  typeof label === "string" ? label : label.name,
                ),
              );
              if (
                prerequisite.state !== "closed" &&
                !labels.has("almago-plan-done")
              ) {
                core.setFailed("A45 prerequisite reopened before readiness: " + id);
                return;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prerequisite.number,
                per_page: 100,
              });
              if (
                !comments.some(comment =>
                  finalEvidenceMatches[id](String(comment.body || "")),
                )
              ) {
                core.setFailed(
                  "A45 exact-main prerequisite evidence changed before readiness: " + id,
                );
                return;
              }
            }

            const renderBaseUrl = String(process.env.RENDER_BASE_URL || "").replace(/\/$/, "");
            if (!renderBaseUrl) {
              core.setFailed("A45 cannot publish READY: missing Render base URL.");
              return;
            }

            let finalRenderHealth;
            try {
              const response = await fetch(renderBaseUrl + "/api/health", {
                headers: { "cache-control": "no-cache" },
              });
              if (!response.ok) {
                core.setFailed(
                  "A45 cannot publish READY: final Render health check returned HTTP " +
                    response.status +
                    ".",
                );
                return;
              }
              finalRenderHealth = await response.json();
            } catch (error) {
              core.setFailed(
                "A45 cannot publish READY: final Render health check failed: " +
                  String(error?.message || error),
              );
              return;
            }

            const finalExpectedRevision = sha.slice(0, 12);
            if (
              finalRenderHealth?.revision !== finalExpectedRevision ||
              finalRenderHealth?.branch !== "main"
            ) {
              core.setFailed(
                "A45 cannot publish READY: Render drifted before publication. Expected " +
                  finalExpectedRevision +
                  " on main, got " +
                  String(finalRenderHealth?.revision || "none") +
                  " on " +
                  String(finalRenderHealth?.branch || "none") +
                  ".",
              );
              return;
            }

            let a45 = allIssues.find(issue =>
              !issue.pull_request &&
              String(issue.body || "").includes("<!-- almago-plan-task:A45 -->")
            );

            if (!a45) {
              const planResponse = await github.rest.repos.getContent({
                owner,
                repo,
                path: "config/almago-master-plan.json",
                ref: sha,
              });
              if (Array.isArray(planResponse.data) || !("content" in planResponse.data)) {
                core.setFailed("Unable to load the AlmaGo Master Plan for A45.");
                return;
              }
              const plan = JSON.parse(
                Buffer.from(planResponse.data.content, "base64").toString("utf8"),
              );
              const task = plan.tasks.find(item => item.id === "A45");
              if (!task) {
                core.setFailed("A45 is missing from the AlmaGo Master Plan.");
                return;
              }

              const created = await github.rest.issues.create({
                owner,
                repo,
                title: "[A45] " + task.title,
                body: [
                  "<!-- almago-plan-task:A45 -->",
                  "Plan task: A45",
                  "Execution: system",
                  "",
                  "Goal:",
                  task.title,
                  "",
                  "Acceptance:",
                  ...(task.acceptance || []).map(item => "- " + item),
                  "",
                  "Created by the successful AlmaGo Final Release Gate."
                ].join("\n"),
                labels: ["almago-plan", "almago-system-required"],
              });
              a45 = created.data;
            }

            const body = [
              "RELEASE GATE: READY",
              "",
              "Exact main SHA: " + sha,
              "Runtime: https://almago-dev.onrender.com",
              "",
              "A38/A43/A44 complete, unit/security/business checks green, public + authenticated browser journeys green, and Render is serving the exact main revision.",
              "",
              "**No deployment or merge was performed by this gate.**"
            ].join("\n");

            if (a45) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: a45.number,
                body,
              });
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: a45.number,
                labels: ["almago-plan-done"],
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: a45.number,
                state: "closed",
                state_reason: "completed",
              });
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "almago-master-orchestrator.yml",
              ref: "main",
            });

            await core.summary
              .addHeading("AlmaGo final release gate")
              .addRaw(
                "RELEASE GATE: READY\n\nExact main SHA: " +
                sha +
                "\n\nRender exact-main verification passed. Master Orchestrator refresh dispatched.",
              )
              .write();

      - name: Upload Render release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almago-final-render-${{ github.run_id }}
          path: artifacts/final-release/render-health.json
          retention-days: 14
          if-no-files-found: warn
