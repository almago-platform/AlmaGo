name: AlmaGo Prelaunch Performance Improvement

# Partner-Ready Calm Mode: automatic triggers are paused; run this workflow manually when needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: almago-prelaunch-performance
  cancel-in-progress: true

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check release state
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node autonomy/continuous-improvement.mjs activation

      - name: Install dependencies
        if: steps.release.outputs.active != 'true'
        run: |
          npm ci
          npm install --no-save --package-lock=false @lhci/cli@0.15.1

      - name: Prepare safe public configuration
        if: steps.release.outputs.active != 'true'
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_prelaunch_performance_placeholder" >> "$GITHUB_ENV"
          fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No supported Chrome/Chromium binary found."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Build AlmaGo
        if: steps.release.outputs.active != 'true'
        run: npm run build

      - name: Start production server
        if: steps.release.outputs.active != 'true'
        run: |
          mkdir -p artifacts
          npm start -- -p 3000 > artifacts/server.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat artifacts/server.log
          exit 1

      - name: Collect Lighthouse evidence
        if: steps.release.outputs.active != 'true'
        run: npx lhci autorun --config=./lighthouserc.prelaunch-performance.cjs || true

      - name: Build one measured performance plan
        id: plan
        if: steps.release.outputs.active != 'true'
        env:
          ALMAGO_MAIN_SHA: ${{ github.sha }}
          ALMAGO_LIGHTHOUSE_REPORT_DIR: artifacts/lighthouse
          ALMAGO_PERFORMANCE_PLAN_PATH: artifacts/prelaunch-performance/plan.json
          ALMAGO_PERFORMANCE_MIN_RUNS: "3"
        run: node autonomy/prelaunch-performance.mjs

      - name: Dispatch at most one measured performance task
        if: steps.release.outputs.active != 'true' && steps.plan.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALMAGO_COPILOT_AUTOPILOT_TOKEN: ${{ secrets.ALMAGO_COPILOT_AUTOPILOT_TOKEN }}
          ALMAGO_COPILOT_AUTOPILOT_ENABLED: "true"
          ALMAGO_COPILOT_AUTOPILOT_DRY_RUN: "false"
          ALMAGO_COPILOT_AUTOPILOT_PLAN_PATH: artifacts/prelaunch-performance/plan.json
          ALMAGO_COPILOT_AUTOPILOT_MAX_NEW_TASKS: "1"
        run: node autonomy/copilot-autopilot.mjs

      - name: Store performance evidence
        if: always() && steps.release.outputs.active != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: almago-prelaunch-performance-${{ github.run_id }}
          path: |
            artifacts/lighthouse/
            artifacts/server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "## AlmaGo Prelaunch Performance Improvement"
            echo
            echo "Post-launch active: ${{ steps.release.outputs.active || 'unknown' }}"
            echo "Performance task eligible: ${{ steps.plan.outputs.eligible || 'false' }}"
            echo "Reason: ${{ steps.plan.outputs.reason || 'none' }}"
            echo "Measured homepage median: ${{ steps.plan.outputs.performance_score || 'n/a' }}"
            echo "Measured range: ${{ steps.plan.outputs.performance_range || 'n/a' }}"
            echo "Homepage runs: ${{ steps.plan.outputs.run_count || 'n/a' }}"
            echo
            echo "A live task is allowed only when the median of 3 homepage runs is below the 0.80 performance budget while accessibility, SEO and best-practices remain healthy."
            echo "Writable scope is exactly HomeHeader.tsx, HomeHero.tsx and HomeJourneySection.tsx; merge remains disabled."
          } >> "$GITHUB_STEP_SUMMARY"
