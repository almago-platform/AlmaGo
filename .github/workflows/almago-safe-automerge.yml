name: AlmaGo Merge Readiness

on:
  workflow_run:
    workflows: ["AlmaGo PR CI", "AlmaGo Browser Quality"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read

concurrency:
  group: almago-merge-readiness-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  verify-readiness:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify safety gates and publish readiness only
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;

            let pullNumber = Number(run.pull_requests?.[0]?.number || 0);
            if (!pullNumber && run.head_branch) {
              const { data: candidates } = await github.rest.pulls.list({
                owner, repo, state: "open", head: `${owner}:${run.head_branch}`, per_page: 10
              });
              pullNumber = Number(candidates.find(pr => pr.head.sha === headSha)?.number || 0);
            }
            if (!pullNumber) return;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pr.state !== "open" || pr.head.sha !== headSha || pr.head.repo?.full_name !== `${owner}/${repo}`) return;

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const mainBranch = repository.default_branch || "main";
            if (pr.base.ref !== mainBranch || pr.base.repo?.full_name !== `${owner}/${repo}`) return;

            const { data: main } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: mainBranch,
            });
            const mainSha = main.commit.sha;

            const comparison = await github.request(
              "GET /repos/{owner}/{repo}/compare/{basehead}",
              {
                owner,
                repo,
                basehead: `${mainSha}...${headSha}`,
              },
            );
            if (Number(comparison.data.behind_by || 0) !== 0) return;

            const branchMatch = pr.head.ref.match(/^automation\/issue-([1-9][0-9]*)$/);
            if (!branchMatch) return;
            const issueNumber = Number(branchMatch[1]);

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const labels = new Set(issue.labels.map(label => typeof label === "string" ? label : label.name));
            if (!labels.has("almago-plan") || !labels.has("almago-ai-proposed") ||
                labels.has("almago-ai-blocked") || labels.has("almago-human-required") ||
                labels.has("almago-codex-required")) return;

            const taskId = String(issue.body || "").match(/<!--\s*almago-plan-task:(A\d{2})\s*-->/)?.[1];
            if (!taskId) return;

            const planResponse = await github.rest.repos.getContent({
              owner, repo, path: "config/almago-master-plan.json", ref: mainSha
            });
            if (Array.isArray(planResponse.data) || !("content" in planResponse.data)) throw new Error("Unable to load master plan.");
            const plan = JSON.parse(Buffer.from(planResponse.data.content, "base64").toString("utf8"));
            const task = plan.tasks.find(item => item.id === taskId);
            if (!task || task.execution !== "ai" || task.risk !== "low") return;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pullNumber, per_page: 100 });
            const changed = files.map(file => file.filename);
            const allowed = new Set(task.files || []);
            const protectedPath = file =>
              file.startsWith("src/app/api/") ||
              file.startsWith("src/app/admin/") ||
              file.startsWith("src/app/auth/") ||
              file.startsWith("src/app/login/") ||
              file.startsWith("src/app/signup/") ||
              file.startsWith("src/app/reset-password/") ||
              file.startsWith("src/components/admin/") ||
              file.startsWith("src/components/auth/") ||
              file.startsWith("src/lib/supabase/") ||
              /^src\/lib\/.*(?:auth|role|permission|security|secret|token)/i.test(file);
            if (!changed.length || changed.length > 3 || changed.some(file => !allowed.has(file) || protectedPath(file))) return;

            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 100 });
            const matching = runs.workflow_runs.filter(item => item.head_sha === headSha);
            const required = ["AlmaGo PR CI", "AlmaGo Browser Quality"];
            const green = required.every(name =>
              matching.some(item => item.name === name && item.status === "completed" && item.conclusion === "success")
            );
            if (!green) return;

            const { data: latestMain } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: mainBranch,
            });
            const { data: latestPr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (
              latestMain.commit.sha !== mainSha ||
              latestPr.state !== "open" ||
              latestPr.head.sha !== headSha ||
              latestPr.base.ref !== mainBranch
            ) return;

            const finalComparison = await github.request(
              "GET /repos/{owner}/{repo}/compare/{basehead}",
              {
                owner,
                repo,
                basehead: `${mainSha}...${headSha}`,
              },
            );
            if (Number(finalComparison.data.behind_by || 0) !== 0) return;

            const marker = `<!-- almago-merge-ready:head=${headSha};main=${mainSha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pullNumber, per_page: 100
            });
            if (!comments.some(comment => String(comment.body || "").includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pullNumber,
                body: [
                  "MERGE READINESS: READY",
                  "",
                  `Plan task: ${taskId}`,
                  `HEAD: ${headSha}`,
                  `Exact main SHA: ${mainSha}`,
                  marker,
                  "",
                  "Exact-file scope, canonical CI and browser/accessibility quality are green, and the branch contains exact current main.",
                  "**No automatic merge is performed.** Merge remains explicitly controlled."
                ].join("\n")
              });
            }
            core.summary.addHeading("AlmaGo merge readiness").addRaw(`PR #${pullNumber} is ready for controlled merge. Render exact-main verification remains an A45 release concern after merge.`).write();
