name: AlmaGo AI Task Queue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number (leave blank for oldest ready issue)
        required: false
        type: string

concurrency:
  group: almago-ai-task-queue
  cancel-in-progress: false

jobs:
  propose:
    if: ${{ vars.ALMAGO_AI_ENABLED == 'true' && vars.ALMAGO_AI_FREE_ONLY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      number: ${{ steps.pick.outputs.number }}
      base: ${{ steps.pick.outputs.base }}
      deliver: ${{ steps.provider.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enforce daily AI task cap
        id: budget
        uses: actions/github-script@v7
        env:
          MAX_DAILY_TASKS: ${{ vars.ALMAGO_MAX_AI_TASKS_PER_DAY }}
        with:
          script: |
            const parsed = Number.parseInt(process.env.MAX_DAILY_TASKS || "10", 10);
            const max = Number.isFinite(parsed) ? Math.min(12, Math.max(1, parsed)) : 10;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "almago-ai-queue.yml",
              per_page: 100,
            });
            const start = new Date();
            start.setUTCHours(0, 0, 0, 0);
            const today = data.workflow_runs.filter(run =>
              new Date(run.created_at).getTime() >= start.getTime()
            );
            const allowed = today.length <= max;
            core.setOutput("allowed", allowed ? "true" : "false");
            core.summary
              .addHeading("AlmaGo AI free-task daily cap")
              .addRaw(`Runs today: ${today.length} / ${max}. Provider work ${allowed ? "allowed" : "paused until next UTC day"}.`)
              .write();

      - name: Check provider configuration
        if: steps.budget.outputs.allowed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Configure GEMINI_API_KEY or GROQ_API_KEY in GitHub Secrets."
            exit 1
          fi
      - name: Pick one ready issue
        if: steps.budget.outputs.allowed == 'true'
        id: pick
        uses: actions/github-script@v7
        env:
          REQUESTED_ISSUE: ${{ inputs.issue_number }}
        with:
          script: |
            const repo = context.repo;
            const requested = process.env.REQUESTED_ISSUE?.trim();
            if (requested && !/^[1-9][0-9]*$/.test(requested)) {
              core.setFailed("Invalid issue number.");
              return;
            }
            const issues = requested
              ? [(await github.rest.issues.get({ ...repo, issue_number: Number(requested) })).data]
              : (await github.rest.issues.listForRepo({
                  ...repo, state: "open", labels: "almago-ai-ready",
                  sort: "created", direction: "asc", per_page: 30
                })).data;
            const issue = issues.find(item =>
              item.state === "open" && !item.pull_request &&
              item.labels.some(label => label.name === "almago-ai-ready")
            );
            if (!issue) {
              if (requested) core.setFailed("Issue is not open and labeled almago-ai-ready.");
              else core.info("No ready issue.");
              return;
            }
            const branch = "automation/issue-" + issue.number;
            try {
              await github.rest.git.getRef({ ...repo, ref: "heads/" + branch });
              core.setFailed("Issue already has an automation branch; resolve it first.");
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.removeLabel({
              ...repo, issue_number: issue.number, name: "almago-ai-ready"
            });
            await github.rest.issues.addLabels({
              ...repo, issue_number: issue.number, labels: ["almago-ai-running"]
            });
            const fs = require("fs");
            fs.writeFileSync(".almago-task.json", JSON.stringify({
              number: issue.number, title: issue.title, body: issue.body
            }));
            core.setOutput("number", String(issue.number));
            core.setOutput("base", context.sha);
      - name: Validate worker
        if: steps.pick.outputs.number != ''
        run: node --test autonomy/autonomous-propose.test.mjs
      - name: Request bounded patch
        id: provider
        if: steps.pick.outputs.number != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALMAGO_GEMINI_MODEL: ${{ vars.ALMAGO_GEMINI_MODEL }}
          ALMAGO_GROQ_MODEL: ${{ vars.ALMAGO_GROQ_MODEL }}
        run: |
          set +e
          node autonomy/autonomous-propose.mjs .almago-task.json
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo "retryable=true" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "retryable=false" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Return task to queue when free providers are temporarily unavailable
        if: steps.pick.outputs.number != '' && steps.provider.outputs.retryable == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.pick.outputs.number }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number, name: "almago-ai-running"
            }).catch(e => { if (e.status !== 404) throw e; });
            await github.rest.issues.addLabels({
              ...context.repo, issue_number, labels: ["almago-ai-ready"]
            });
            core.summary
              .addHeading("Free AI providers temporarily unavailable")
              .addRaw("Issue #" + issue_number + " was returned to almago-ai-ready and will be retried by a later five-minute cycle.")
              .write();
      - name: Check patch against exact issue paths
        if: steps.pick.outputs.number != '' && steps.provider.outputs.retryable != 'true'
        run: |
          node autonomy/autonomous-propose.mjs .almago-task.json --validate almago-ai.patch
          git apply --check almago-ai.patch
          git apply almago-ai.patch
          git diff --check
          git diff --exit-code -- . ':!src/app' ':!src/components' ':!src/content' ':!src/lib'
      - name: Independent cross-provider review
        if: steps.pick.outputs.number != '' && steps.provider.outputs.retryable != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALMAGO_GEMINI_MODEL: ${{ vars.ALMAGO_GEMINI_MODEL }}
          ALMAGO_GROQ_MODEL: ${{ vars.ALMAGO_GROQ_MODEL }}
        run: node autonomy/autonomous-review.mjs .almago-task.json almago-ai.patch almago-ai-provider.json
      - name: Verify proposal locally
        if: steps.pick.outputs.number != '' && steps.provider.outputs.retryable != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run lint
          npm run build
      - name: Store verified patch
        if: steps.pick.outputs.number != '' && steps.provider.outputs.retryable != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: almago-ai-proposal-${{ github.run_id }}
          path: |
            .almago-task.json
            almago-ai.patch
            almago-ai-provider.json
            almago-ai-review.txt
          if-no-files-found: error
          retention-days: 1
      - name: Report proposal failure
        if: failure() && steps.pick.outputs.number != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.pick.outputs.number }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number, name: "almago-ai-running"
            }).catch(e => { if (e.status !== 404) throw e; });
            await github.rest.issues.addLabels({
              ...context.repo, issue_number, labels: ["almago-ai-blocked"]
            });
            await github.rest.issues.createComment({
              ...context.repo, issue_number,
              body: (() => {
                const fs = require("fs");
                const review = fs.existsSync("almago-ai-review.txt")
                  ? "\n\nIndependent review:\n\n" + fs.readFileSync("almago-ai-review.txt", "utf8").slice(0, 4000)
                  : "";
                return "Automatic proposal stopped. Check the Actions run " +
                  context.runId + " before relabeling this issue almago-ai-ready." + review;
              })()
            });

  deliver:
    needs: propose
    if: needs.propose.result == 'success' && needs.propose.outputs.number != '' && needs.propose.outputs.deliver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: almago-ai-proposal-${{ github.run_id }}
          path: .ai-artifact
      - name: Validate and commit proposal
        id: commit
        env:
          ISSUE_NUMBER: ${{ needs.propose.outputs.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node autonomy/autonomous-propose.mjs .ai-artifact/.almago-task.json --validate .ai-artifact/almago-ai.patch
          git apply --check .ai-artifact/almago-ai.patch
          git apply --index .ai-artifact/almago-ai.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: propose AlmaGo task #$ISSUE_NUMBER"
          branch="automation/issue-$ISSUE_NUMBER"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$branch"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open PR and request canonical CI
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.propose.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const head = process.env.HEAD_SHA;
            const branch = "automation/issue-" + issue_number;
            const { data: pr } = await github.rest.pulls.create({
              ...context.repo, base: context.ref.replace("refs/heads/", ""),
              head: branch,
              title: "Proposition automatique pour #" + issue_number,
              body: "Closes #" + issue_number + "\n\nProposition limitée aux fichiers de la tâche. Vérifier les changements et les checks avant fusion. Aucune fusion automatique."
            });
            const { data: remote } = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number
            });
            if (remote.head.sha !== head) throw new Error("PR remote HEAD mismatch.");
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number, name: "almago-ai-running"
            });
            await github.rest.issues.addLabels({
              ...context.repo, issue_number, labels: ["almago-ai-proposed"]
            });
            await github.rest.repos.createDispatchEvent({
              ...context.repo, event_type: "almago_ci_verify",
              client_payload: { pull_number: pr.number, head_sha: head, source: "AlmaGo AI Task Queue" }
            });
            core.info("PR #" + pr.number + " opened at verified HEAD " + head);
      - name: Report delivery failure
        if: failure()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.propose.outputs.number }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number, name: "almago-ai-running"
            }).catch(e => { if (e.status !== 404) throw e; });
            await github.rest.issues.addLabels({
              ...context.repo, issue_number, labels: ["almago-ai-blocked"]
            });
            await github.rest.issues.createComment({
              ...context.repo, issue_number,
              body: "Automatic delivery stopped in Actions run " + context.runId +
                ". Check whether automation/issue-" + issue_number +
                " or a PR exists before retrying."
            });
