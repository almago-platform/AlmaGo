name: AlmaGo Merged Branch Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: almago-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete merged branches safely
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch || "main";

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100,
            });
            const openHeads = new Set(
              openPulls
                .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map(pr => pr.head.ref),
            );

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "closed", base: defaultBranch, per_page: 100,
            });

            const mergedHeads = [...new Set(
              closedPulls
                .filter(pr => Boolean(pr.merged_at) && pr.head.repo?.full_name === `${owner}/${repo}`)
                .map(pr => pr.head.ref),
            )].sort();

            const deleted = [];
            const skipped = [];
            for (const branch of mergedHeads) {
              if (branch === defaultBranch || openHeads.has(branch)) {
                skipped.push(branch);
                continue;
              }
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
              deleted.push(branch);
            }

            await core.summary
              .addHeading("AlmaGo merged branch cleanup")
              .addRaw(`Deleted: ${deleted.length}\n\nSkipped active/protected: ${skipped.length}\n`)
              .write();
