name: AlmaGo Merged Branch Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview eligible merged branches without deleting refs"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: almago-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Plan or delete proven merged AlmaGo branches
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = String(process.env.DRY_RUN).toLowerCase() !== "false";
            const repository = context.payload.repository ||
              (await github.rest.repos.get({ owner, repo })).data;
            const defaultBranch = repository.default_branch || "main";

            const allowedPrefixes = [
              "codex/",
              "design/",
              "phase5/",
              "hardening/",
              "feat/",
              "automation/",
              "chore/",
              "plan/",
              "ci/",
              "docs/",
              "fix/",
              "test/",
              "dependabot/",
            ];
            const protectedPrefixes = ["archive/", "backup/"];

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const openRefs = new Set();
            for (const pr of openPulls) {
              if (pr.head.repo?.full_name === `${owner}/${repo}`) openRefs.add(pr.head.ref);
              if (pr.base.repo?.full_name === `${owner}/${repo}`) openRefs.add(pr.base.ref);
            }

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              base: defaultBranch,
              per_page: 100,
            });

            const mergedHeadShas = new Map();
            for (const pr of closedPulls) {
              if (!pr.merged_at || pr.head.repo?.full_name !== `${owner}/${repo}`) continue;
              const branch = pr.head.ref;
              if (!allowedPrefixes.some((prefix) => branch.startsWith(prefix))) continue;
              if (protectedPrefixes.some((prefix) => branch.startsWith(prefix))) continue;
              if (!pr.head.sha) continue;

              if (!mergedHeadShas.has(branch)) mergedHeadShas.set(branch, new Set());
              mergedHeadShas.get(branch).add(pr.head.sha);
            }

            const planned = [];
            const deleted = [];
            const skipped = [];

            for (const branch of [...mergedHeadShas.keys()].sort()) {
              if (
                branch === defaultBranch ||
                branch === "main" ||
                openRefs.has(branch) ||
                protectedPrefixes.some((prefix) => branch.startsWith(prefix))
              ) {
                skipped.push(`${branch} — protected or used by an open PR`);
                continue;
              }

              let ref;
              try {
                ref = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
              } catch (error) {
                if (error.status === 404) {
                  skipped.push(`${branch} — already absent`);
                  continue;
                }
                throw error;
              }

              const currentSha = ref.data.object.sha;
              const provenMergedShas = mergedHeadShas.get(branch);
              if (!provenMergedShas?.has(currentSha)) {
                skipped.push(`${branch} — current tip ${currentSha.slice(0, 12)} does not equal a merged PR head`);
                continue;
              }

              planned.push(`${branch} @ ${currentSha}`);
              if (dryRun) continue;

              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              deleted.push(`${branch} @ ${currentSha}`);
            }

            await core.summary
              .addHeading("AlmaGo branch cleanup")
              .addRaw("Mode: " + (dryRun ? "DRY RUN" : "DELETE") + "\n\n")
              .addRaw("Proven eligible refs: " + planned.length + "\n")
              .addList(planned.length ? planned : ["None."])
              .addRaw("\nDeleted refs: " + deleted.length + "\n")
              .addList(deleted.length ? deleted : ["None."])
              .addRaw("\nSkipped/protected refs: " + skipped.length + "\n")
              .addList(skipped.length ? skipped : ["None."])
              .write();
