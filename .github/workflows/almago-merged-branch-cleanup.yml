name: AlmaGo Merged Branch Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: almago-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged AlmaGo branches safely
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = context.payload.repository ||
              (await github.rest.repos.get({ owner, repo })).data;
            const defaultBranch = repository.default_branch || "main";

            const allowedPrefixes = [
              "codex/",
              "design/",
              "phase5/",
              "hardening/",
              "feat/",
              "automation/",
              "chore/",
            ];

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const openHeads = new Set(
              openPulls
                .filter((pr) => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref),
            );

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              base: defaultBranch,
              per_page: 100,
            });

            const mergedHeads = [...new Set(
              closedPulls
                .filter((pr) =>
                  Boolean(pr.merged_at) &&
                  pr.head.repo?.full_name === `${owner}/${repo}` &&
                  allowedPrefixes.some((prefix) => pr.head.ref.startsWith(prefix))
                )
                .map((pr) => pr.head.ref),
            )].sort();

            const deleted = [];
            const skipped = [];

            for (const branch of mergedHeads) {
              if (branch === defaultBranch || branch === "main" || openHeads.has(branch)) {
                skipped.push(branch);
                continue;
              }

              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }

              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              deleted.push(branch);
            }

            await core.summary
              .addHeading("AlmaGo branch cleanup")
              .addRaw(`Deleted merged branches: ${deleted.length}
`)
              .addList(deleted.length ? deleted : ["No stale merged branch found."])
              .addRaw(`
Skipped protected/open branches: ${skipped.length}
`)
              .addList(skipped.length ? skipped : ["None."])
              .write();
