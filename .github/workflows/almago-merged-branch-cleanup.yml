name: AlmaGo Merged Branch Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview eligible deletions without deleting refs"
        required: true
        default: true
        type: boolean
      confirm_delete:
        description: "Required only for deletion mode: type DELETE_MERGED_BRANCHES"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: almago-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review merged AlmaGo branches safely
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository =
              context.payload.repository ||
              (await github.rest.repos.get({ owner, repo })).data;
            const defaultBranch = repository.default_branch || "main";
            const dryRun = String(process.env.DRY_RUN).toLowerCase() !== "false";
            const confirmation = String(process.env.CONFIRM_DELETE || "");
            const maxDeletePerRun = 20;

            if (!dryRun && confirmation !== "DELETE_MERGED_BRANCHES") {
              core.setFailed(
                "Deletion mode requires confirm_delete=DELETE_MERGED_BRANCHES.",
              );
              return;
            }

            const allowedPrefixes = [
              "codex/",
              "design/",
              "phase5/",
              "hardening/",
              "feat/",
              "automation/",
              "chore/",
              "plan/",
              "ci/",
              "docs/",
              "fix/",
              "test/",
              "dependabot/",
            ];

            const permanentlyExcludedPrefixes = ["archive/", "backup/"];

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const openHeads = new Set(
              openPulls
                .filter((pr) => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref),
            );
            const openBases = new Set(
              openPulls
                .filter((pr) => pr.base.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.base.ref),
            );

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              base: defaultBranch,
              per_page: 100,
            });

            const mergedByBranch = new Map();

            for (const pr of closedPulls) {
              if (
                !pr.merged_at ||
                pr.head.repo?.full_name !== `${owner}/${repo}` ||
                !allowedPrefixes.some((prefix) => pr.head.ref.startsWith(prefix))
              ) {
                continue;
              }

              if (!mergedByBranch.has(pr.head.ref)) {
                mergedByBranch.set(pr.head.ref, []);
              }
              mergedByBranch.get(pr.head.ref).push(pr);
            }

            const eligible = [];
            const deleted = [];
            const skippedProtected = [];
            const skippedChanged = [];

            for (const branch of [...mergedByBranch.keys()].sort()) {
              if (
                branch === defaultBranch ||
                branch === "main" ||
                openHeads.has(branch) ||
                openBases.has(branch) ||
                permanentlyExcludedPrefixes.some((prefix) =>
                  branch.startsWith(prefix),
                )
              ) {
                skippedProtected.push(branch);
                continue;
              }

              let currentRef;
              try {
                currentRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }

              const currentSha = currentRef.data.object.sha;
              const mergedPulls = mergedByBranch.get(branch) || [];
              const exactMergedHead = mergedPulls.some(
                (pr) => pr.head.sha === currentSha,
              );

              if (!exactMergedHead) {
                skippedChanged.push(`${branch} @ ${currentSha}`);
                continue;
              }

              eligible.push({ branch, sha: currentSha });
            }

            if (!dryRun && eligible.length > maxDeletePerRun) {
              core.setFailed(
                `Refusing to delete ${eligible.length} branches in one run; maximum is ${maxDeletePerRun}. Narrow the eligible set before retrying.`,
              );
              return;
            }

            if (!dryRun) {
              for (const candidate of eligible) {
                let freshRef;
                try {
                  freshRef = await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${candidate.branch}`,
                  });
                } catch (error) {
                  if (error.status === 404) {
                    throw new Error(
                      `Branch disappeared during deletion preflight: ${candidate.branch}`,
                    );
                  }
                  throw error;
                }

                const freshSha = freshRef.data.object.sha;
                if (freshSha !== candidate.sha) {
                  throw new Error(
                    `Branch tip changed during deletion preflight: ${candidate.branch} expected ${candidate.sha}, got ${freshSha}`,
                  );
                }

                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${candidate.branch}`,
                });
                deleted.push(`${candidate.branch} @ ${candidate.sha}`);
              }
            }

            const eligibleSummary = eligible.map(
              ({ branch, sha }) => `${branch} @ ${sha}`,
            );

            await core.summary
              .addHeading("AlmaGo merged branch cleanup")
              .addRaw(`Mode: ${dryRun ? "DRY RUN" : "DELETE"}\n\n`)
              .addRaw("Eligible in this run: " + eligibleSummary.length + "\n")
              .addList(eligibleSummary.length ? eligibleSummary : ["None."])
              .addRaw(
                "\nPer-run deletion cap: " + maxDeletePerRun + "\n",
              )
              .addRaw("\nDeleted: " + deleted.length + "\n")
              .addList(deleted.length ? deleted : ["None."])
              .addRaw(
                "\nSkipped because branch is protected/open: " +
                  skippedProtected.length +
                  "\n",
              )
              .addList(skippedProtected.length ? skippedProtected : ["None."])
              .addRaw(
                "\nSkipped because current tip no longer matches a merged PR head: " +
                  skippedChanged.length +
                  "\n",
              )
              .addList(skippedChanged.length ? skippedChanged : ["None."])
              .write();
