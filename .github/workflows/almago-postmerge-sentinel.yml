name: AlmaGo Post-Merge Sentinel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: almago-postmerge-sentinel
  cancel-in-progress: true

jobs:
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test main
        id: tests
        continue-on-error: true
        run: npm test

      - name: Typecheck main
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Lint main
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Publish or clear autonomy quarantine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALMAGO_MAIN_HEAD: ${{ github.sha }}
          ALMAGO_TEST_OUTCOME: ${{ steps.tests.outcome }}
          ALMAGO_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          ALMAGO_LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: node autonomy/postmerge-quarantine.mjs

      - name: Fail workflow when main is unhealthy
        if: steps.tests.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.lint.outcome != 'success'
        run: exit 1
