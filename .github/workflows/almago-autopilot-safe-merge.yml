name: AlmaGo Autopilot Safe Merge

# Partner-Ready Calm Mode: automatic triggers are paused; run this workflow manually when needed.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  statuses: read

concurrency:
  group: almago-autopilot-safe-merge
  cancel-in-progress: false

jobs:
  safe-merge:
    if: vars.ALMAGO_AUTOPILOT_AUTOMERGE_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALMAGO_AUTOPILOT_AUTOMERGE_ENABLED: ${{ vars.ALMAGO_AUTOPILOT_AUTOMERGE_ENABLED }}
      ALMAGO_AUTOPILOT_AUTOMERGE_DRY_RUN: ${{ vars.ALMAGO_AUTOPILOT_AUTOMERGE_DRY_RUN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate fail-closed merge policy
        run: node --test autonomy/autopilot-safe-merge.test.mjs

      - name: Evaluate one safe merge candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node autonomy/autopilot-safe-merge.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "## AlmaGo Autopilot Safe Merge"
            echo
            echo "Enabled: ${ALMAGO_AUTOPILOT_AUTOMERGE_ENABLED:-false}"
            echo "Dry run: ${ALMAGO_AUTOPILOT_AUTOMERGE_DRY_RUN:-true}"
            echo
            echo "Real merge requires ENABLED=true and DRY_RUN=false."
            echo "The executor also requires an active default-branch ruleset with PR enforcement and strict required status-check job 'verify'."
            echo "At most one candidate may be merged per run after immediate revalidation."
          } >> "$GITHUB_STEP_SUMMARY"
