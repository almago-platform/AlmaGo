name: AlmaGo PR CI


on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  repository_dispatch:
    types: [almago_ci_verify]


permissions:
  contents: write
  issues: write
  pull-requests: write


concurrency:
  group: almago-pr-ci-${{ github.event.pull_request.number || github.event.client_payload.pull_number }}
  cancel-in-progress: true


jobs:
  verify:
    if: >-
      (
        github.event_name == 'repository_dispatch' &&
        github.event.action == 'almago_ci_verify' &&
        github.event.client_payload.pull_number != null &&
        github.event.client_payload.head_sha != null
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pull_number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha }}

    steps:
      - name: Revalidate exact PR head
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            const expectedHead = String(process.env.EXPECTED_HEAD || "");
            if (!pullNumber || !expectedHead) {
              core.setFailed("CI verification requires a PR number and expected HEAD.");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pr.state !== "open" || pr.head.sha !== expectedHead) {
              core.setFailed("Stale CI handoff: expected " + expectedHead + ", actual " + pr.head.sha + ".");
              return;
            }
            core.setOutput("head_sha", pr.head.sha);

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Tests
        run: npm test --if-present


      - name: Typecheck
        run: npx tsc --noEmit


      - name: Lint
        run: npm run lint


      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build


      - name: Diff check
        run: git diff --check




      - name: Publish verified review checkpoint
        if: success()
        uses: actions/github-script@v7
        env:
          VERIFIED_HEAD: ${{ steps.pr.outputs.head_sha }}
          VERIFIED_PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = process.env.VERIFIED_HEAD;
            const pullNumber = Number(process.env.VERIFIED_PR_NUMBER);
            const marker = `<!-- almago-pr-ci:verified-head=${head} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });

            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info("Verified checkpoint already published for " + head + ".");
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body: [
                  "ALMAGO REVIEW REQUEST",
                  "",
                  "REMOTE HEAD: " + head,
                  "SOURCE: AlmaGo PR CI",
                  marker,
                  "",
                  "Canonical remote checks passed: tests, TypeScript, lint, build and git diff --check.",
                ].join("\n"),
              });
            }

            // GITHUB_TOKEN comments do not trigger issue_comment workflows.
            // repository_dispatch is explicitly exempt from GitHub recursion protection.
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: "almago_supervise",
              client_payload: {
                pull_number: pullNumber,
                head_sha: head,
                checkpoint_id: "pr-ci-" + head,
                source: "AlmaGo PR CI",
              },
            });
            core.info("Dispatched reliable supervision handoff for " + head + ".");

      - name: Publish CI failure handoff
        if: failure()
        uses: actions/github-script@v7
        env:
          FAILED_HEAD: ${{ steps.pr.outputs.head_sha }}
          FAILED_PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = process.env.FAILED_HEAD;
            const pullNumber = Number(process.env.FAILED_PR_NUMBER);
            const marker = `<!-- almago-pr-ci:failed-head=${head};run=${context.runId} -->`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              body: [
                "CI: FAILED",
                "",
                `HEAD: ${head}`,
                marker,
                "",
                "Le workflow canonique AlmaGo PR CI a échoué. Consulte les checks de ce HEAD et corrige uniquement les causes d’échec.",
                "",
                "@codex address that feedback",
              ].join("\n"),
            });

            const { data: failedPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const automationMatch = failedPr.head.ref.match(/^automation\/issue-([1-9][0-9]*)$/);
            if (automationMatch) {
              const issueNumber = Number(automationMatch[1]);
              for (const name of ["almago-ai-running", "almago-ai-proposed"]) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name,
                }).catch(() => null);
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["almago-ai-blocked"],
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: "AUTOMATION: BLOCKED\n\nCanonical CI failed for PR #" + pullNumber +
                  ". No additional provider call was spent automatically. Inspect the failed CI run before retrying.",
              });
            }