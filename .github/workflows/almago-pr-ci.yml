name: AlmaGo PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: almago-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test --if-present

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Diff check
        run: git diff --check


      - name: Dispatch instant supervisor
        if: success()
        uses: actions/github-script@v7
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = process.env.VERIFIED_HEAD;
            await github.request("POST /repos/{owner}/{repo}/dispatches", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: "almago_supervise",
              client_payload: {
                pull_number: context.issue.number,
                remote_head: head,
                checkpoint_id: `pr-ci-${context.runId}-${head}`,
                created_at: new Date().toISOString(),
              },
            });
            core.info(`Dispatched instant supervision for PR #${context.issue.number} at ${head}.`);

      - name: Publish verified review checkpoint
        if: success()
        uses: actions/github-script@v7
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = process.env.VERIFIED_HEAD;
            const marker = `<!-- almago-pr-ci:verified-head=${head} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info(`Verified checkpoint already published for ${head}.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "ALMAGO REVIEW REQUEST",
                "",
                `REMOTE HEAD: ${head}`,
                "SOURCE: AlmaGo PR CI",
                marker,
                "",
                "Canonical remote checks passed: tests, TypeScript, lint, build and git diff --check.",
              ].join("\n"),
            });

      - name: Publish CI failure handoff
        if: failure()
        uses: actions/github-script@v7
        env:
          FAILED_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = process.env.FAILED_HEAD;
            const marker = `<!-- almago-pr-ci:failed-head=${head};run=${context.runId} -->`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "CI: FAILED",
                "",
                `HEAD: ${head}`,
                marker,
                "",
                "Le workflow canonique AlmaGo PR CI a échoué. Consulte les checks de ce HEAD et corrige uniquement les causes d’échec.",
                "",
                "@codex address that feedback",
              ].join("\n"),
            });
