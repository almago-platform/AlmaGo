name: AlmaGo Authenticated E2E

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Authenticated E2E target"
        required: false
        default: render
        type: choice
        options: [render, local]

permissions:
  contents: read

concurrency:
  group: almago-authenticated-e2e
  cancel-in-progress: true

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ALMAGO_E2E_STUDENT_EMAIL: ${{ vars.ALMAGO_E2E_STUDENT_EMAIL || 'phase3.student.c@almago.test' }}
      ALMAGO_E2E_STUDENT_PASSWORD: ${{ secrets.ALMAGO_E2E_STUDENT_PASSWORD }}
      ALMAGO_E2E_ADMIN_EMAIL: ${{ vars.ALMAGO_E2E_ADMIN_EMAIL || 'phase3.admin.b@almago.test' }}
      ALMAGO_E2E_ADMIN_PASSWORD: ${{ secrets.ALMAGO_E2E_ADMIN_PASSWORD }}
      ALMAGO_E2E_TARGET: ${{ inputs.target || 'render' }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Require E2E configuration
        shell: bash
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ALMAGO_E2E_STUDENT_EMAIL ALMAGO_E2E_STUDENT_PASSWORD ALMAGO_E2E_ADMIN_EMAIL ALMAGO_E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is required"; exit 1; fi
          done

      - name: Install browser tools
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - run: npx playwright install --with-deps chromium

      - name: Configure target
        shell: bash
        run: |
          if [ "$ALMAGO_E2E_TARGET" = "render" ]; then
            echo "ALMAGO_BASE_URL=${{ vars.ALMAGO_PRODUCTION_URL || 'https://almago-dev.onrender.com' }}" >> "$GITHUB_ENV"
          else
            echo "ALMAGO_BASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          fi

      - name: Build and start local target
        if: env.ALMAGO_E2E_TARGET == 'local'
        shell: bash
        run: |
          npm run build
          npm start -- -p 3000 > /tmp/almago-e2e.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/almago-e2e.log
          exit 1

      - name: Verify Render health
        if: env.ALMAGO_E2E_TARGET == 'render'
        run: curl --fail --show-error --silent "$ALMAGO_BASE_URL/api/health"

      - name: Student/admin isolation
        run: npx playwright test tests/e2e/authenticated.spec.mjs --project=desktop-chromium

      - name: Student quality
        run: npx playwright test tests/e2e/student-space-quality.spec.mjs

      - name: Admin quality
        run: npx playwright test tests/e2e/admin-space-quality.spec.mjs
