name: AlmaGo Authenticated E2E

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Automation probe: skip cleanly if A43 passwords are not configured yet"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "src/app/admin/**"
      - "src/app/student/**"
      - "src/app/login/**"
      - "src/components/auth/**"
      - "src/components/student/**"
      - "src/components/admin/**"
      - "src/components/layout/AppShell.tsx"
      - "src/app/globals.css"
      - "playwright.config.mjs"
      - "src/lib/supabase/**"
      - "src/lib/auth/**"
      - "src/lib/phase4.ts"
      - "src/lib/documents.ts"
      - "src/lib/source-verification.ts"
      - "src/lib/application-intake.ts"
      - "src/lib/identifiers.ts"
      - "src/proxy.ts"
      - "tests/e2e/authenticated.spec.mjs"
      - "tests/e2e/student-space-quality.spec.mjs"
      - "tests/e2e/admin-space-quality.spec.mjs"
      - ".github/workflows/almago-authenticated-e2e.yml"

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: almago-authenticated-e2e
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ALMAGO_E2E_STUDENT_EMAIL: ${{ vars.ALMAGO_E2E_STUDENT_EMAIL || 'phase3.student.a@almago.test' }}
      ALMAGO_E2E_STUDENT_PASSWORD: ${{ secrets.ALMAGO_E2E_STUDENT_PASSWORD }}
      ALMAGO_E2E_ADMIN_EMAIL: ${{ vars.ALMAGO_E2E_ADMIN_EMAIL || 'phase3.admin@almago.test' }}
      ALMAGO_E2E_ADMIN_PASSWORD: ${{ secrets.ALMAGO_E2E_ADMIN_PASSWORD }}
      ALMAGO_E2E_PROBE_MODE: ${{ inputs.probe }}
    steps:
      - name: Detect authenticated E2E configuration
        id: check
        shell: bash
        run: |
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ALMAGO_E2E_STUDENT_EMAIL ALMAGO_E2E_STUDENT_PASSWORD ALMAGO_E2E_ADMIN_EMAIL ALMAGO_E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticated E2E is not configured yet (${#missing[@]} required configuration value(s) missing)."
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ALMAGO_E2E_PROBE_MODE" != "true" ]; then
              echo "::error::Missing required configuration names: ${missing[*]}"
              echo "::error::Authenticated E2E cannot run until all required repository secrets are configured."
              exit 1
            fi
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Authenticated E2E configuration detected."

  authenticated-e2e:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ALMAGO_E2E_STUDENT_EMAIL: ${{ vars.ALMAGO_E2E_STUDENT_EMAIL || 'phase3.student.a@almago.test' }}
      ALMAGO_E2E_STUDENT_PASSWORD: ${{ secrets.ALMAGO_E2E_STUDENT_PASSWORD }}
      ALMAGO_E2E_ADMIN_EMAIL: ${{ vars.ALMAGO_E2E_ADMIN_EMAIL || 'phase3.admin@almago.test' }}
      ALMAGO_E2E_ADMIN_PASSWORD: ${{ secrets.ALMAGO_E2E_ADMIN_PASSWORD }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Require dedicated E2E configuration
        shell: bash
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ALMAGO_E2E_STUDENT_EMAIL ALMAGO_E2E_STUDENT_PASSWORD ALMAGO_E2E_ADMIN_EMAIL ALMAGO_E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is required for authenticated E2E"; exit 1; fi
          done

      - name: Require distinct test-only identities
        shell: bash
        run: |
          student_email="$(printf '%s' "$ALMAGO_E2E_STUDENT_EMAIL" | tr '[:upper:]' '[:lower:]')"
          admin_email="$(printf '%s' "$ALMAGO_E2E_ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]')"

          if [ "$student_email" = "$admin_email" ]; then
            echo "::error::Student and admin E2E accounts must be different."
            exit 1
          fi

          for email in "$student_email" "$admin_email"; do
            case "$email" in
              *e2e*|*test*) ;;
              *)
                echo "::error::Authenticated E2E emails must be dedicated test identities containing 'e2e' or 'test'."
                exit 1
                ;;
            esac
          done

      - name: Install authenticated browser-quality tools without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start AlmaGo
        shell: bash
        run: |
          mkdir -p artifacts/auth-e2e
          npm run build
          npm start -- -p 3000 > artifacts/auth-e2e/server.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat artifacts/auth-e2e/server.log
          exit 1

      - name: Run student/admin isolation journeys
        run: npx playwright test tests/e2e/authenticated.spec.mjs --project=desktop-chromium

      - name: Run authenticated Student Space quality matrix
        run: npx playwright test tests/e2e/student-space-quality.spec.mjs

      - name: Run authenticated Admin Space quality matrix
        run: npx playwright test tests/e2e/admin-space-quality.spec.mjs

      - name: Complete A43 after successful authenticated evidence
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const planIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              labels: "almago-plan",
              per_page: 100,
            });

            const a38 = planIssues.find(item =>
              !item.pull_request &&
              String(item.body || "").includes("<!-- almago-plan-task:A38 -->")
            );
            const a38Labels = new Set(
              (a38?.labels || []).map(label => typeof label === "string" ? label : label.name)
            );
            const a38Complete = Boolean(
              a38 && (a38.state === "closed" || a38Labels.has("almago-plan-done"))
            );
            if (!a38Complete) {
              core.info("A43 evidence is green, but A38 is not complete; A43 will remain open.");
              return;
            }

            const issue = planIssues.find(item =>
              !item.pull_request &&
              item.state === "open" &&
              String(item.body || "").includes("<!-- almago-plan-task:A43 -->")
            );
            if (!issue) {
              core.info("A43 is already closed or not materialized.");
              return;
            }

            const marker = `<!-- almago-a43-evidence:run=${context.runId};sha=${context.sha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });
            if (!comments.some(comment => String(comment.body || "").includes(marker))) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: [
                  "A43 AUTHENTICATED E2E: PASS",
                  "",
                  "Run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId,
                  "SHA: " + context.sha,
                  marker,
                  "",
                  "Dedicated student/admin identities passed the authenticated isolation journeys plus the Student Space and Admin Space responsive/accessibility quality matrices."
                ].join("\n"),
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issue.number,
              labels: ["almago-plan-done"],
            });
            for (const label of ["almago-human-required", "almago-ai-blocked"]) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issue.number,
                name: label,
              }).catch(() => null);
            }
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: "closed",
              state_reason: "completed",
            });

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "almago-master-orchestrator.yml",
              ref: "main",
            });

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almago-auth-e2e-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
