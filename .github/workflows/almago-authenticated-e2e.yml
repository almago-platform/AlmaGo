name: AlmaGo Authenticated E2E

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Authenticated E2E target"
        required: false
        default: vps
        type: choice
        options: [vps, local]
  workflow_call:
    inputs:
      target:
        description: "Authenticated E2E target"
        required: false
        default: vps
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: almago-authenticated-e2e
  cancel-in-progress: true

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ALMAGO_E2E_STUDENT_EMAIL: ${{ vars.ALMAGO_E2E_STUDENT_EMAIL || 'phase3.student.c@almago.test' }}
      ALMAGO_E2E_STUDENT_PASSWORD: ${{ secrets.ALMAGO_E2E_STUDENT_PASSWORD }}
      ALMAGO_E2E_TARGET: ${{ inputs.target || 'vps' }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Require student E2E configuration
        shell: bash
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ALMAGO_E2E_STUDENT_EMAIL ALMAGO_E2E_STUDENT_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is required"; exit 1; fi
          done

      - name: Require A38 human gate before VPS evidence
        if: env.ALMAGO_E2E_TARGET == 'vps'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/66" |
              jq -r '.state'
          )"
          if [ "$state" != "closed" ]; then
            echo "::error::A38 (#66) must be genuinely closed before final VPS authenticated evidence."
            exit 1
          fi

      - name: Install browser tools
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - run: npx playwright install --with-deps chromium

      - name: Configure target
        shell: bash
        run: |
          if [ "$ALMAGO_E2E_TARGET" = "vps" ]; then
            echo "ALMAGO_BASE_URL=https://campusallemagne.tn" >> "$GITHUB_ENV"
          elif [ "$ALMAGO_E2E_TARGET" = "local" ]; then
            echo "ALMAGO_BASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          else
            echo "::error::Unsupported E2E target: $ALMAGO_E2E_TARGET"
            exit 1
          fi

      - name: Build and start local target
        if: env.ALMAGO_E2E_TARGET == 'local'
        shell: bash
        run: |
          npm run build
          npm start -- -p 3000 > /tmp/almago-e2e.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/almago-e2e.log
          exit 1

      - name: Verify exact VPS revision
        if: env.ALMAGO_E2E_TARGET == 'vps'
        shell: bash
        run: |
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "::error::main changed before authenticated VPS evidence"
            exit 1
          fi
          expected="${GITHUB_SHA:0:12}"
          health="$(curl --fail --silent --show-error --max-time 10 "$ALMAGO_BASE_URL/api/health")"
          revision="$(printf '%s' "$health" | jq -r '.revision // empty')"
          branch="$(printf '%s' "$health" | jq -r '.branch // empty')"
          if [ "$revision" != "$expected" ]; then
            echo "::error::Authenticated E2E requires exact VPS revision $expected on main; got ${revision:-none}."
            exit 1
          fi
          printf '%s\n' "$health"

      - name: Student authentication and admin isolation
        run: npx playwright test tests/e2e/authenticated.spec.mjs --project=desktop-chromium

      - name: Student quality
        run: npx playwright test tests/e2e/student-space-quality.spec.mjs

      - name: Revalidate exact main and VPS after authenticated evidence
        if: env.ALMAGO_E2E_TARGET == 'vps'
        shell: bash
        run: |
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "::error::main changed during authenticated E2E. Tested $GITHUB_SHA, current $current_main."
            exit 1
          fi

          expected="${GITHUB_SHA:0:12}"
          health="$(curl --fail --silent --show-error --max-time 10 "$ALMAGO_BASE_URL/api/health")"
          revision="$(printf '%s' "$health" | jq -r '.revision // empty')"
          branch="$(printf '%s' "$health" | jq -r '.branch // empty')"
          if [ "$revision" != "$expected" ] || [ "$branch" != "main" ]; then
            echo "::error::VPS drifted during authenticated E2E. Expected $expected on main; got ${revision:-none} on ${branch:-none}."
            exit 1
          fi

      - name: Require exact-SHA human admin AAL2 evidence
        if: env.ALMAGO_E2E_TARGET == 'vps'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- almago-a43-admin-human-approved:sha=$GITHUB_SHA -->"
          comments="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/84/comments?per_page=100"
          )"
          approved="$(
            printf '%s' "$comments" |
              jq --arg marker "$marker" '[.[] | select(
                (.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
                and (.body | contains($marker))
              )] | length'
          )"
          if [ "$approved" -lt 1 ]; then
            echo "::error::Missing exact-SHA human admin AAL2 evidence on issue #84."
            echo "::error::After manually verifying the sole real admin on this exact VPS SHA, add this marker to issue #84: $marker"
            exit 1
          fi

      - name: Revalidate A38 human gate after authenticated evidence
        if: env.ALMAGO_E2E_TARGET == 'vps'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/66" |
              jq -r '.state'
          )"
          if [ "$state" != "closed" ]; then
            echo "::error::A38 (#66) is no longer closed after authenticated evidence; discard this run."
            exit 1
          fi
