name: AlmaGo Continuous Improvement

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: almago-continuous-improvement
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check post-launch activation
        id: activation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node autonomy/continuous-improvement.mjs activation

      - uses: actions/setup-node@v4
        if: steps.activation.outputs.active == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.activation.outputs.active == 'true'
        run: npm ci

      - name: Prepare sensor artifacts
        if: steps.activation.outputs.active == 'true'
        run: mkdir -p artifacts/continuous-improvement

      - name: Test sensor
        id: tests
        if: steps.activation.outputs.active == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee artifacts/continuous-improvement/tests.log

      - name: Typecheck sensor
        id: typecheck
        if: steps.activation.outputs.active == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee artifacts/continuous-improvement/typecheck.log

      - name: Lint sensor
        id: lint
        if: steps.activation.outputs.active == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/continuous-improvement/lint.log

      - name: Production dependency audit sensor
        if: steps.activation.outputs.active == 'true'
        run: |
          npm audit --omit=dev --json > artifacts/continuous-improvement/npm-audit.json || true

      - name: Publish deterministic improvement signals
        if: steps.activation.outputs.active == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALMAGO_TEST_OUTCOME: ${{ steps.tests.outcome }}
          ALMAGO_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          ALMAGO_LINT_OUTCOME: ${{ steps.lint.outcome }}
          ALMAGO_AUDIT_JSON: artifacts/continuous-improvement/npm-audit.json
          ALMAGO_TEST_LOG: artifacts/continuous-improvement/tests.log
          ALMAGO_TYPECHECK_LOG: artifacts/continuous-improvement/typecheck.log
          ALMAGO_LINT_LOG: artifacts/continuous-improvement/lint.log
        run: node autonomy/continuous-improvement.mjs publish

      - name: Summary
        if: always()
        run: |
          {
            echo "## AlmaGo Continuous Improvement"
            echo
            echo "Post-launch active: ${{ steps.activation.outputs.active || 'false' }}"
            echo "Test sensor: ${{ steps.tests.outcome || 'not-run' }}"
            echo "Typecheck sensor: ${{ steps.typecheck.outcome || 'not-run' }}"
            echo "Lint sensor: ${{ steps.lint.outcome || 'not-run' }}"
            echo
            echo "Signals are discovery issues only; they do not authorize implementation or merge."
          } >> "$GITHUB_STEP_SUMMARY"
