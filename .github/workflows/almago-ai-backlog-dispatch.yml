name: AlmaGo AI Backlog Dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/almago-ai-backlog-dispatch.yml"
      - ".github/workflows/almago-ai-queue.yml"
      - "autonomy/plan-core.mjs"
      - "autonomy/plan-sync.mjs"
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: almago-ai-backlog-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch oldest bounded standalone AI task
        uses: actions/github-script@v7
        env:
          AI_ENABLED: ${{ vars.ALMAGO_AI_ENABLED }}
          BILLING_CAP_CONFIRMED: ${{ vars.ALMAGO_AI_BILLING_CAP_CONFIRMED }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (process.env.AI_ENABLED !== "true" || process.env.BILLING_CAP_CONFIRMED !== "true") {
              core.summary
                .addHeading("AlmaGo AI backlog dispatch")
                .addRaw("Standalone AI backlog is ready, but provider execution is gated. Set ALMAGO_AI_ENABLED=true and ALMAGO_AI_BILLING_CAP_CONFIRMED=true only after provider billing caps are configured.")
                .write();
              core.info("AI provider gate is inactive; no dispatch.");
              return;
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "almago-ai-ready",
              sort: "created",
              direction: "asc",
              per_page: 100,
            });

            const task = issues.find((issue) => {
              if (issue.pull_request) return false;
              const body = String(issue.body || "");
              if (!body.includes("<!-- almago-ai-task -->")) return false;
              if (body.includes("<!-- almago-plan-task:")) return false;
              const labels = new Set((issue.labels || []).map((label) =>
                typeof label === "string" ? label : label.name
              ));
              return !labels.has("almago-ai-running")
                && !labels.has("almago-ai-blocked")
                && !labels.has("almago-ai-proposed");
            });

            if (!task) {
              core.summary
                .addHeading("AlmaGo AI backlog dispatch")
                .addRaw("No standalone almago-ai-ready task is waiting.")
                .write();
              core.info("No standalone AI-ready issue.");
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: "almago-ai-queue.yml",
              per_page: 20,
            });
            const active = runs.workflow_runs.find((run) =>
              run.status === "queued" || run.status === "in_progress"
            );
            if (active) {
              core.summary
                .addHeading("AlmaGo AI backlog dispatch")
                .addRaw("AI queue run #" + active.id + " is already " + active.status + "; skipped duplicate dispatch.")
                .write();
              core.info("AI queue already active; skipping.");
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "almago-ai-queue.yml",
              ref: "main",
              inputs: { issue_number: String(task.number) },
            });

            core.summary
              .addHeading("AlmaGo AI backlog dispatch")
              .addRaw("Dispatched issue #" + task.number + " to AlmaGo AI Task Queue.")
              .write();
            core.info("Dispatched standalone AI task #" + task.number + ".");
