name: AlmaGo Partner-Ready Rehearsal

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: almago-partner-ready-rehearsal
  cancel-in-progress: true

jobs:
  rehearsal:
    if: >-
      github.event.issue.number == 686 &&
      github.event.comment.user.login == 'tayariAyoub' &&
      github.event.comment.body == 'PARTNER READY REHEARSAL'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      ALMAGO_BASE_URL: https://almago-dev.onrender.com
      ALMAGO_PHASE2_ENABLED: "true"
      ALMAGO_E2E_REDACT_SECRETS: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ALMAGO_E2E_STUDENT_EMAIL: ${{ vars.ALMAGO_E2E_STUDENT_EMAIL || 'phase3.student.c@almago.test' }}
      ALMAGO_E2E_STUDENT_PASSWORD: ${{ secrets.ALMAGO_E2E_STUDENT_PASSWORD }}
      ALMAGO_E2E_ADMIN_EMAIL: ${{ vars.ALMAGO_E2E_ADMIN_EMAIL || 'phase3.admin.b@almago.test' }}
      ALMAGO_E2E_ADMIN_PASSWORD: ${{ secrets.ALMAGO_E2E_ADMIN_PASSWORD }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Require dedicated E2E identities
        shell: bash
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ALMAGO_E2E_STUDENT_EMAIL ALMAGO_E2E_STUDENT_PASSWORD ALMAGO_E2E_ADMIN_EMAIL ALMAGO_E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Partner-Ready rehearsal configuration: $name"
              exit 1
            fi
          done
          for email in "$ALMAGO_E2E_STUDENT_EMAIL" "$ALMAGO_E2E_ADMIN_EMAIL"; do
            normalized="$(printf '%s' "$email" | tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              *e2e*|*test*) ;;
              *) echo "::error::Partner-Ready identities must be dedicated test accounts."; exit 1 ;;
            esac
          done

      - name: Install browser rehearsal tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact Partner-Ready Render target
        shell: bash
        run: |
          mkdir -p artifacts/partner-ready
          expected_sha="$(git rev-parse HEAD)"
          expected_revision="${expected_sha:0:12}"
          for i in {1..60}; do
            health="$(curl --fail --silent --show-error --max-time 10 "$ALMAGO_BASE_URL/api/health" 2>/dev/null || true)"
            if [ -n "$health" ]; then
              printf '%s\n' "$health" > artifacts/partner-ready/render-health.json
              revision="$(printf '%s' "$health" | jq -r '.revision // empty' 2>/dev/null || true)"
              branch="$(printf '%s' "$health" | jq -r '.branch // empty' 2>/dev/null || true)"
              mode="$(printf '%s' "$health" | jq -r '.exposureMode // empty' 2>/dev/null || true)"
              if [ "$revision" = "$expected_revision" ] && [ "$branch" = "main" ] && [ "$mode" = "partner_prelaunch" ]; then
                echo "Partner-Ready Render exact-SHA verified: $revision."
                exit 0
              fi
              echo "Waiting for exact Partner-Ready Render target (expected $expected_revision/main/partner_prelaunch; got ${revision:-none}/${branch:-none}/${mode:-none})."
            fi
            sleep 5
          done
          echo "::error::Render did not reach the exact Partner-Ready main revision in time."
          exit 1

      - name: Public FR/AR responsive and accessibility rehearsal
        run: npx playwright test tests/e2e/public-quality.spec.mjs --project=desktop-chromium --project=tablet-chromium --project=mobile-360-chromium

      - name: Student/admin role isolation
        run: npx playwright test tests/e2e/authenticated.spec.mjs --project=desktop-chromium

      - name: Student Space FR/AR quality matrix
        run: npx playwright test tests/e2e/student-space-quality.spec.mjs

      - name: Partner email and zero-money payment sandbox
        run: npx playwright test tests/e2e/partner-demo.spec.mjs --project=desktop-chromium --project=mobile-360-chromium

      - name: Admin Space quality matrix
        run: npx playwright test tests/e2e/admin-space-quality.spec.mjs

      - name: Revalidate exact main and Render after rehearsal
        shell: bash
        run: |
          git fetch origin main --depth=1
          tested_sha="$(git rev-parse HEAD)"
          current_main="$(git rev-parse origin/main)"
          if [ "$tested_sha" != "$current_main" ]; then
            echo "::error::main changed during Partner-Ready rehearsal: tested $tested_sha, current $current_main"
            exit 1
          fi
          expected_revision="${tested_sha:0:12}"
          health="$(curl --fail --silent --show-error --max-time 10 "$ALMAGO_BASE_URL/api/health")"
          revision="$(printf '%s' "$health" | jq -r '.revision // empty')"
          branch="$(printf '%s' "$health" | jq -r '.branch // empty')"
          mode="$(printf '%s' "$health" | jq -r '.exposureMode // empty')"
          if [ "$revision" != "$expected_revision" ] || [ "$branch" != "main" ] || [ "$mode" != "partner_prelaunch" ]; then
            echo "::error::Render drifted during Partner-Ready rehearsal."
            exit 1
          fi

      - name: Store Partner-Ready artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: almago-partner-ready-${{ github.run_id }}
          path: |
            artifacts/partner-ready/
            artifacts/screenshots/
            artifacts/auth-e2e/
            artifacts/playwright/
          retention-days: 7
          if-no-files-found: warn
