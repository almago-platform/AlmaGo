name: AlmaGo Master Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: almago-master-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate master plan and router
        run: node --test autonomy/plan-core.test.mjs

      - name: Sync plan and select next task
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node autonomy/plan-sync.mjs

      - name: Run Copilot Autopilot controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALMAGO_COPILOT_AUTOPILOT_TOKEN: ${{ secrets.ALMAGO_COPILOT_AUTOPILOT_TOKEN }}
          ALMAGO_COPILOT_AUTOPILOT_ENABLED: ${{ vars.ALMAGO_COPILOT_AUTOPILOT_ENABLED }}
          ALMAGO_COPILOT_AUTOPILOT_DRY_RUN: ${{ vars.ALMAGO_COPILOT_AUTOPILOT_DRY_RUN }}
        run: node autonomy/copilot-autopilot.mjs

      - name: Probe A43 authenticated E2E
        if: >-
          steps.sync.outputs.task_id == 'A43' &&
          steps.sync.outputs.issue_number != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "almago-authenticated-e2e.yml",
              ref: "main",
              inputs: { probe: "true" }
            });
            core.info("Dispatched safe A43 authenticated E2E probe.");

      - name: Dispatch bounded Gemini/Groq free worker
        if: >-
          steps.sync.outputs.route == 'ai' &&
          steps.sync.outputs.issue_number != '' &&
          vars.ALMAGO_AI_ENABLED == 'true' &&
          vars.ALMAGO_AI_FREE_ONLY == 'true'
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ steps.sync.outputs.issue_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: "almago-ai-queue.yml",
              per_page: 20,
            });
            const active = runs.workflow_runs.find((run) =>
              run.status === "queued" || run.status === "in_progress"
            );
            if (active) {
              core.info(
                "AI queue already active in run #" + active.id +
                " (" + active.status + "); skipping duplicate dispatch."
              );
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "almago-ai-queue.yml",
              ref: "main",
              inputs: { issue_number: process.env.ISSUE_NUMBER }
            });
            core.info("Dispatched bounded AI queue for issue #" + process.env.ISSUE_NUMBER);

      - name: Explain inactive AI provider gate
        if: >-
          steps.sync.outputs.route == 'ai' &&
          steps.sync.outputs.issue_number != '' &&
          (vars.ALMAGO_AI_ENABLED != 'true' || vars.ALMAGO_AI_FREE_ONLY != 'true')
        run: |
          echo "Task is READY but external AI is intentionally inactive."
          echo "Enable ALMAGO_AI_ENABLED and ALMAGO_AI_FREE_ONLY to use the bounded Gemini/Groq free-provider queue."

      - name: Summarize routing
        run: |
          echo "Task: ${{ steps.sync.outputs.task_id || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Route: ${{ steps.sync.outputs.route || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Issue: ${{ steps.sync.outputs.issue_number || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
