name: AlmaGo A38 Human Approval Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: almago-a38-human-approval
  cancel-in-progress: false

jobs:
  approve-a38:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, 'A38 HUMAN REVIEW APPROVED')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact A38 human approval
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment;
            const issuePayload = context.payload.issue;

            if (!comment || !issuePayload || issuePayload.pull_request) {
              core.info("Not an issue comment; nothing to do.");
              return;
            }

            const approval = String(comment.body || "").trim();
            if (approval !== "A38 HUMAN REVIEW APPROVED") {
              core.info("Not the exact A38 approval phrase; nothing to do.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issuePayload.number;
            const approver = comment.user?.login;

            if (!approver) {
              core.setFailed("A38 approval requires an authenticated GitHub user.");
              return;
            }

            const { data: approverPermission } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: approver,
              });

            if (approverPermission.permission !== "admin") {
              core.setFailed(
                "Only a repository admin may approve the A38 human-review gate.",
              );
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });

            if (!String(issue.body || "").includes("<!-- almago-plan-task:A38 -->")) {
              core.setFailed("The approval phrase was not posted on the A38 plan issue.");
              return;
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const mainBranch = repository.default_branch || "main";
            const { data: main } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: mainBranch,
            });
            const sha = main.commit.sha;
            const readinessMarker = `<!-- almago-a38-review-ready:sha=${sha} -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            if (!comments.some(item => String(item.body || "").includes(readinessMarker))) {
              core.setFailed(
                "A38 cannot close: no review-ready evidence exists for the exact current main SHA " + sha + "."
              );
              return;
            }

            const evidenceMarker = `<!-- almago-a38-human-approved:sha=${sha};comment=${comment.id} -->`;
            if (!comments.some(item => String(item.body || "").includes(evidenceMarker))) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  "A38 HUMAN REVIEW GATE: APPROVED",
                  "",
                  "Exact main SHA: " + sha,
                  "Owner approval comment: " + comment.html_url,
                  evidenceMarker,
                  "",
                  "This records the human approval signal only. It does not claim independent legal advice."
                ].join("\n"),
              });
            }

            const [{ data: finalMain }, { data: finalIssue }] = await Promise.all([
              github.rest.repos.getBranch({
                owner,
                repo,
                branch: mainBranch,
              }),
              github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              }),
            ]);

            if (finalMain.commit.sha !== sha) {
              core.setFailed(
                "A38 cannot close because main changed after readiness/approval validation. Expected " +
                  sha +
                  ", current " +
                  finalMain.commit.sha +
                  ".",
              );
              return;
            }

            const finalLabels = new Set(
              (finalIssue.labels || []).map(label =>
                typeof label === "string" ? label : label.name,
              ),
            );
            finalLabels.add("almago-plan-done");
            finalLabels.delete("almago-human-required");
            finalLabels.delete("almago-ai-blocked");

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              labels: [...finalLabels],
              state: "closed",
              state_reason: "completed",
            });

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "almago-master-orchestrator.yml",
              ref: mainBranch,
            });

            core.info(
              "A38 closed after exact-SHA readiness evidence plus repository-admin approval.",
            );
