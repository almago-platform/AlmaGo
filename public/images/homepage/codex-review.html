<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Codex V4 — contrôle responsive temporaire</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#e8ebf3;color:#182442;font:14px/1.5 system-ui,sans-serif}header{max-width:1280px;margin:0 auto 16px}h1{font-size:18px;margin:0 0 10px}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:white;color:#182442;border:1px solid #71809b;border-radius:5px;padding:9px 14px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#2349c9;color:white}button:focus-visible{outline:3px solid #905411;outline-offset:3px}#stage{width:100%;display:flex;justify-content:center}#frame-wrap{position:relative;flex-shrink:0}iframe{transform-origin:top left}iframe{display:block;background:white;border:0;flex-shrink:0;box-shadow:0 0 0 1px #99a6bf}pre{white-space:pre-wrap;max-width:1280px;margin:12px auto;overflow-wrap:anywhere;font:12px/1.5 monospace}#controls{display:flex;gap:8px;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>Contrôle temporaire — Homepage Codex V4</h1>
<nav aria-label="Largeur de contrôle">
<button data-width="360" data-height="800" aria-pressed="true">360 px</button>
<button data-width="390" data-height="844" aria-pressed="false">390 px</button>
<button data-width="430" data-height="932" aria-pressed="false">430 px</button>
<button data-width="768" data-height="1024" aria-pressed="false">768 px</button>
<button data-width="1440" data-height="900" aria-pressed="false">1440 px</button>
<button data-width="1920" data-height="1080" aria-pressed="false">1920 px</button>
</nav>
<div id="controls"><button id="audit">Contrôler la vue</button><button id="full">Afficher toute la page</button><button id="viewport">Rétablir la hauteur d’écran</button></div>
<nav aria-label="Section à vérifier" style="margin-top:10px"><button data-section="hero-title">Hero</button><button data-section="espace">Produit</button><button data-section="parcours">Parcours</button><button data-section="confiance">Engagements</button><button data-section="faq">FAQ et footer</button></nav>
</header>
<pre id="result" aria-live="polite">Chargement…</pre>
<div id="stage"><div id="frame-wrap"><iframe id="review-frame" title="Homepage Codex V4" src="/" width="360" height="800"></iframe></div></div>
<script>
const frame=document.getElementById("review-frame");
const result=document.getElementById("result");
let width=360,height=800;
function fit(){const scale=Math.min(1,(document.documentElement.clientWidth-36)/width);frame.style.transform=`scale(${scale})`;const wrap=document.getElementById("frame-wrap");wrap.style.width=`${width*scale}px`;wrap.style.height=`${Number(frame.height)*scale}px`;}

function audit(){
  fit();
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!d || !d.querySelector("h1")){result.textContent="La homepage n’est pas encore chargée.";return;}
  const rects=Array.from(d.querySelectorAll("main a,main button,header a,header button,summary")).filter(e=>e.getBoundingClientRect().width>0).filter(e=>{const r=e.getBoundingClientRect();return r.right>d.documentElement.clientWidth+1||r.left < -1;}).map(e=>e.textContent.trim().slice(0,60));
  const anchors=Array.from(d.querySelectorAll('a[href^="#"]')).map(e=>e.getAttribute("href")).filter(h=>h.length>1&&!d.getElementById(h.slice(1)));
  const aria=Array.from(d.querySelectorAll("[aria-controls]")).filter(e=>!d.getElementById(e.getAttribute("aria-controls"))).map(e=>e.id);
  result.textContent=JSON.stringify({requestedWidth:width,innerWidth:w.innerWidth,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,contentHeight:d.documentElement.scrollHeight,outsideControls:rects,missingAnchors:anchors,missingAriaTargets:aria,imageLoaded:Array.from(d.querySelectorAll("main img")).every(i=>i.complete&&i.naturalWidth>0)},null,2);
}
document.querySelectorAll("[data-width]").forEach(b=>b.addEventListener("click",()=>{width=Number(b.dataset.width);height=Number(b.dataset.height);frame.width=String(width);frame.height=String(height);document.querySelectorAll("[data-width]").forEach(v=>v.setAttribute("aria-pressed",String(v===b)));requestAnimationFrame(audit);}));
document.getElementById("audit").addEventListener("click",audit);
document.getElementById("full").addEventListener("click",()=>{frame.height=String(frame.contentDocument.documentElement.scrollHeight+10);requestAnimationFrame(()=>{frame.height=String(frame.contentDocument.documentElement.scrollHeight+10);audit();});});
document.getElementById("viewport").addEventListener("click",()=>{frame.height=String(height);requestAnimationFrame(audit);});
document.querySelectorAll("[data-section]").forEach(b=>b.addEventListener("click",()=>{frame.height=String(height);fit();const target=frame.contentDocument.getElementById(b.dataset.section);frame.contentWindow.scrollTo(0,b.dataset.section==="hero-title"?0:target.offsetTop-100);audit();}));
frame.addEventListener("load",audit);
window.addEventListener("resize",fit);
fit();
</script>
</body>
</html>
